name: Teste da API da ESPN
on:
  workflow_dispatch: # Só roda manualmente; não altera nenhum arquivo

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Consultar a ESPN e mostrar os jogos no log
        run: node teste-espn.js
