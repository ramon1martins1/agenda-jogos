<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F3F5F7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0E151C" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Agenda" />
  <title>Agenda Tricolor</title>
  <link rel="icon" type="image/png" href="flu-escudo.png" />
  <link rel="apple-touch-icon" href="flu-escudo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..900&display=swap" rel="stylesheet" />
  <style>
    /* ============================================================
       Agenda Tricolor — sistema visual (base do app Fluxo)
       Cores carregam significado: verde = vitória, âmbar = empate,
       rosa = derrota, azul = fora de casa.
       Status sempre com texto, nunca só cor.
       ============================================================ */
    :root {
      --fundo: #F3F5F7;
      --superficie: #FFFFFF;
      --superficie-2: #EEF1F4;
      --borda: #E2E7EC;
      --tinta: #13202B;
      --tinta-2: #46566A;
      --tinta-3: #5B6B7A;

      /* Grená tricolor no lugar do verde-petróleo do Fluxo */
      --marca: #7A1F31;
      --marca-tinta: #FFFFFF;
      --marca-suave: #F3D9DE;

      --entrada: #047857;   --entrada-bg: #D1FAE5;   --entrada-tx: #065F46;
      --saida: #BE123C;     --saida-bg: #FFE4E6;     --saida-tx: #9F1239;
      --atencao: #B45309;   --atencao-bg: #FEF3C7;   --atencao-tx: #92400E;
      --cartao: #1D4ED8;    --cartao-bg: #DBEAFE;    --cartao-tx: #1E40AF;
      --neutro-bg: #E2E8F0; --neutro-tx: #334155;

      --sombra: 0 1px 2px rgba(19, 32, 43, 0.05), 0 4px 16px rgba(19, 32, 43, 0.05);
      --sombra-forte: 0 12px 40px rgba(19, 32, 43, 0.18);
      --raio: 16px;
      --raio-sm: 12px;
      --esp: 16px;

      --fonte: 'Schibsted Grotesk', system-ui, -apple-system, sans-serif;
      color-scheme: light;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --fundo: #0E151C;
        --superficie: #17212B;
        --superficie-2: #1F2B37;
        --borda: #2A3644;
        --tinta: #EAF0F5;
        --tinta-2: #B4C1CD;
        --tinta-3: #94A3B8;

        --marca: #5E1826;
        --marca-tinta: #FBECEF;
        --marca-suave: #4A1A24;

        --entrada: #34D399;   --entrada-bg: #0F3B2F;   --entrada-tx: #A7F3D0;
        --saida: #FB7185;     --saida-bg: #4C1424;     --saida-tx: #FECDD3;
        --atencao: #FBBF24;   --atencao-bg: #43300A;   --atencao-tx: #FDE68A;
        --cartao: #93B4FF;    --cartao-bg: #1E2E57;    --cartao-tx: #BFDBFE;
        --neutro-bg: #2A3644; --neutro-tx: #CBD5E1;

        --sombra: 0 1px 2px rgba(0, 0, 0, 0.3);
        --sombra-forte: 0 12px 40px rgba(0, 0, 0, 0.5);
        color-scheme: dark;
      }
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--fundo);
      color: var(--tinta);
      font-family: var(--fonte);
      font-size: 15px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }
    h1, h2, p { margin: 0; }
    h1 { font-size: 1.5rem; font-weight: 680; letter-spacing: -0.02em; }
    h2 { font-size: 1.0625rem; font-weight: 640; letter-spacing: -0.01em; }
    button { font: inherit; color: inherit; cursor: pointer; }
    :focus-visible { outline: 2px solid var(--marca); outline-offset: 2px; border-radius: 8px; }
    @media (prefers-color-scheme: dark) { :focus-visible { outline-color: var(--entrada); } }

    /* ---------------- Estrutura ---------------- */
    .app {
      min-height: 100dvh; max-width: 560px; margin: 0 auto;
      padding: calc(env(safe-area-inset-top) + 6px) var(--esp) calc(env(safe-area-inset-bottom) + 32px);
    }
    .topo { display: flex; align-items: center; height: 52px; }
    .marca { display: inline-flex; align-items: center; gap: 10px; font-weight: 720; font-size: 1.0625rem; letter-spacing: -0.02em; }
    .marca img { width: 30px; height: 30px; border-radius: 9px; object-fit: cover; }
    .conteudo { display: flex; flex-direction: column; gap: 20px; padding-top: 4px; }

    /* ---------------- Destaque: próximo jogo ---------------- */
    .destaque {
      background: var(--marca); color: var(--marca-tinta);
      border-radius: 22px; padding: 18px; box-shadow: var(--sombra);
      display: flex; flex-direction: column; gap: 10px;
    }
    .destaque-rotulo { font-size: 0.875rem; font-weight: 520; opacity: 0.85; }
    .destaque-jogo { font-size: 1.75rem; font-weight: 700; letter-spacing: -0.03em; line-height: 1.15; }
    .destaque-linha { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 0.875rem; }
    .pilula-clara {
      display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px;
      background: rgba(255, 255, 255, 0.14); font-size: 0.8125rem; font-weight: 600;
    }
    .destaque .botao { align-self: flex-start; margin-top: 4px; background: rgba(255, 255, 255, 0.95); border-color: transparent; color: #5E1826; }

    /* ---------------- Segmentado ---------------- */
    .segmentos { display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: var(--superficie-2); }
    .segmentos button {
      flex: 1; min-height: 40px; padding: 4px 8px; border: 0; border-radius: 11px; background: none;
      color: var(--tinta-2); font-weight: 600; font-size: 0.875rem; line-height: 1.2;
    }
    .segmentos button[aria-pressed='true'] { background: var(--superficie); color: var(--tinta); box-shadow: var(--sombra); }

    /* ---------------- Cartões e listas ---------------- */
    .cartao-ui { background: var(--superficie); border: 1px solid var(--borda); border-radius: var(--raio); box-shadow: var(--sombra); }
    .secao { display: flex; flex-direction: column; gap: 6px; }
    .grupo-titulo {
      display: flex; justify-content: space-between; gap: 12px;
      padding: 10px 4px 6px; font-size: 0.8125rem; font-weight: 640; color: var(--tinta-2);
    }
    .grupo-titulo span:first-child::first-letter { text-transform: uppercase; }
    .grupo-total { font-weight: 600; color: var(--tinta-3); }

    .lista { list-style: none; margin: 0; padding: 4px 0; }
    .lista > li + li .linha { border-top: 1px solid var(--borda); }
    .linha { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 68px; padding: 10px 14px; }
    .linha.inativa .linha-texto, .linha.inativa .avatar { opacity: 0.6; }
    .linha-texto { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1; }
    .linha-nome { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .linha-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; color: var(--tinta-3); font-size: 0.8125rem; }
    .linha-sub { color: var(--tinta-3); font-size: 0.8125rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .linha-fim { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
    .penaltis { font-size: 0.75rem; font-weight: 600; color: var(--tinta-3); }
    .placar { font-weight: 700; font-size: 1.0625rem; letter-spacing: -0.01em; white-space: nowrap; }

    /* Avatares e chips */
    .avatar {
      width: 42px; height: 42px; border-radius: 12px; flex-shrink: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.05;
    }
    .avatar b { font-size: 1rem; font-weight: 720; }
    .avatar small { font-size: 0.625rem; font-weight: 640; text-transform: uppercase; letter-spacing: 0.04em; }
    .avatar-entrada, .chip-entrada { background: var(--entrada-bg); color: var(--entrada-tx); }
    .avatar-saida, .chip-saida { background: var(--saida-bg); color: var(--saida-tx); }
    .avatar-atencao, .chip-atencao { background: var(--atencao-bg); color: var(--atencao-tx); }
    .avatar-cartao, .chip-cartao { background: var(--cartao-bg); color: var(--cartao-tx); }
    .avatar-marca, .chip-marca { background: var(--marca-suave); color: var(--marca); }
    @media (prefers-color-scheme: dark) { .avatar-marca, .chip-marca { color: #F7C9D2; } }
    .avatar-neutro, .chip-neutro { background: var(--neutro-bg); color: var(--neutro-tx); }
    .chip {
      display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px;
      border-radius: 999px; font-size: 0.75rem; font-weight: 620; white-space: nowrap; line-height: 1.5;
    }

    /* ---------------- Botões ---------------- */
    .botao {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 44px; padding: 0 18px; border-radius: 14px;
      border: 1px solid var(--borda); background: var(--superficie); color: var(--tinta);
      font-weight: 640; text-decoration: none;
    }
    .botao.discreto { background: none; border-color: transparent; color: var(--tinta-2); }
    .botao.largo { width: 100%; }
    .icone-botao {
      width: 40px; height: 40px; display: grid; place-items: center; flex-shrink: 0;
      border: 1px solid var(--borda); border-radius: 12px; background: var(--superficie); color: var(--tinta-2);
      text-decoration: none;
    }
    .icone-botao:active { background: var(--superficie-2); }

    /* ---------------- Vazio e carregamento ---------------- */
    .vazio { padding: 22px 18px; display: flex; flex-direction: column; gap: 6px; color: var(--tinta-2); }
    .vazio h2 { color: var(--tinta); }
    .rodape-nota { color: var(--tinta-3); font-size: 0.8125rem; text-align: center; padding: 4px 8px; }
    .esqueleto { display: flex; flex-direction: column; gap: 10px; }
    .esq-bloco { display: block; height: 68px; border-radius: var(--raio); background: linear-gradient(90deg, var(--superficie-2) 0%, var(--superficie) 50%, var(--superficie-2) 100%); background-size: 200% 100%; animation: brilho 1.2s linear infinite; }
    .esq-bloco.alto { height: 170px; border-radius: 22px; }
    @keyframes brilho { from { background-position: 200% 0; } to { background-position: -200% 0; } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
    .so-leitor { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  </style>
</head>

<body>
  <div class="app">
    <header class="topo">
      <span class="marca"><img src="flu-escudo.png" alt="" />Agenda Tricolor</span>
    </header>

    <main class="conteudo">
      <div id="destaque">
        <div class="esqueleto" aria-busy="true" aria-label="Carregando"><span class="esq-bloco alto"></span></div>
      </div>

      <div class="segmentos" role="group" aria-label="Campeonato">
        <button data-liga="Todos">Todos</button>
        <button data-liga="Brasileirão Série A">Brasileirão</button>
        <button data-liga="Copa Libertadores">Libertadores</button>
      </div>

      <section id="lista" class="secao" aria-live="polite">
        <div class="esqueleto"><span class="esq-bloco"></span><span class="esq-bloco"></span><span class="esq-bloco"></span></div>
      </section>

      <button id="btn-passados" class="botao discreto largo" hidden></button>
      <p class="rodape-nota" id="rodape">Horários de Brasília. Dados atualizados todo dia.</p>
    </main>
  </div>

  <script>
    let todosOsJogos = [];
    let ligaAtual = lerPreferencia('agenda:liga', 'Todos');
    let mostrarPassados = false;

    function lerPreferencia(chave, padrao) {
      try { return localStorage.getItem(chave) || padrao; } catch { return padrao; }
    }
    function salvarPreferencia(chave, valor) {
      try { localStorage.setItem(chave, valor); } catch { /* sem armazenamento: ignora */ }
    }

    /* ---------------- Datas ---------------- */
    // Data de hoje no horário de Brasília, no formato AAAA-MM-DD
    function hojeIso() {
      return new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Sao_Paulo' }).format(new Date());
    }
    function isoDoJogo(jogo) {
      const [d, m, a] = jogo.date.split('/');
      return `${a}-${m}-${d}`;
    }
    // Date "de calendário" (meio-dia UTC) para formatar sem escorregar de dia por fuso
    function dataCalendario(iso) {
      const [a, m, d] = iso.split('-').map(Number);
      return new Date(Date.UTC(a, m - 1, d, 12));
    }
    function diasAte(iso) {
      return Math.round((dataCalendario(iso) - dataCalendario(hojeIso())) / 86400000);
    }
    const fmtDiaLongo = new Intl.DateTimeFormat('pt-BR', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' });
    const fmtMesAno = new Intl.DateTimeFormat('pt-BR', { month: 'long', year: 'numeric', timeZone: 'UTC' });
    const fmtDia = new Intl.DateTimeFormat('pt-BR', { day: 'numeric', timeZone: 'UTC' });
    const fmtSemana = new Intl.DateTimeFormat('pt-BR', { weekday: 'short', timeZone: 'UTC' });
    const diaLongo = iso => fmtDiaLongo.format(dataCalendario(iso)).replace(/\./g, '');

    function quandoFalta(iso) {
      const n = diasAte(iso);
      if (n === 0) return 'Hoje';
      if (n === 1) return 'Amanhã';
      if (n > 1) return `Em ${n} dias`;
      return null;
    }

    /* ---------------- Regras ---------------- */
    function temPlacar(jogo) {
      return /^\d+-\d+$/.test(jogo.result || '');
    }
    // Some da lista quando a data já passou E o jogo já tem placar
    function jogoJaPassou(jogo) {
      return isoDoJogo(jogo) < hojeIso() && temPlacar(jogo);
    }
    // Resultado do ponto de vista do Fluminense
    function desfecho(jogo) {
      if (!temPlacar(jogo)) return null;
      const [casa, fora] = jogo.result.split('-').map(Number);
      const flu = jogo.isHome ? casa : fora;
      const adv = jogo.isHome ? fora : casa;
      if (flu > adv) return { tom: 'entrada', texto: 'Vitória' };
      if (flu < adv) return { tom: 'saida', texto: 'Derrota' };
      if (jogo.penalties) {
        const [pc, pf] = jogo.penalties.split('-').map(Number);
        const venceu = jogo.isHome ? pc > pf : pf > pc;
        return venceu ? { tom: 'entrada', texto: 'Vitória (pên.)' } : { tom: 'saida', texto: 'Derrota (pên.)' };
      }
      return { tom: 'atencao', texto: 'Empate' };
    }
    function nomeCurtoLiga(league) {
      if (league.startsWith('Brasileirão')) return league.replace('Brasileirão Série A - ', 'Brasileirão · ');
      if (league.startsWith('Copa Libertadores')) return league.replace('Copa Libertadores - ', 'Libertadores · ').replace('Fase de Grupos - ', 'Grupos · ').replace(/ - /g, ' · ');
      return league;
    }
    function escapar(texto) {
      return String(texto).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    const ICONE_CALENDARIO = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2.5"/><path d="M8 3v4M16 3v4M4 10h16"/><path d="M12 13v4M10 15h4"/></svg>';

    /* ---------------- Destaque: próximo jogo ---------------- */
    function renderizarDestaque(jogos) {
      const alvo = document.getElementById('destaque');
      const hoje = hojeIso();
      const proximo = jogos.find(j => isoDoJogo(j) >= hoje && !temPlacar(j));
      if (!proximo) { alvo.innerHTML = ''; return; }

      const iso = isoDoJogo(proximo);
      const titulo = proximo.isHome ? `Fluminense × ${proximo.opponent}` : `${proximo.opponent} × Fluminense`;
      const falta = quandoFalta(iso);
      alvo.innerHTML = `
        <div class="destaque">
          <span class="destaque-rotulo">Próximo jogo${falta ? ` · ${falta}` : ''}</span>
          <span class="destaque-jogo">${escapar(titulo)}</span>
          <div class="destaque-linha">
            <span class="pilula-clara">${escapar(diaLongo(iso))}</span>
            <span class="pilula-clara">${proximo.time === 'A definir' ? 'Horário a definir' : escapar(proximo.time)}</span>
            <span class="pilula-clara">${escapar(proximo.stadium)}</span>
          </div>
          <span class="destaque-linha">${escapar(proximo.league)}</span>
          <a class="botao" href="${escapar(proximo.calendarLink)}" target="_blank" rel="noopener">${ICONE_CALENDARIO} Adicionar à agenda</a>
        </div>`;
    }

    /* ---------------- Lista ---------------- */
    function linhaDoJogo(jogo) {
      const iso = isoDoJogo(jogo);
      const passou = jogoJaPassou(jogo);
      const res = desfecho(jogo);
      const data = dataCalendario(iso);

      const mando = jogo.isHome
        ? '<span class="chip chip-marca">Casa</span>'
        : '<span class="chip chip-cartao">Fora</span>';
      const hora = jogo.time === 'A definir' ? 'Horário a definir' : jogo.time;
      const status = jogo.result === 'Adiado' ? '<span class="chip chip-atencao">Adiado</span>' : '';

      let fim;
      if (res) {
        const pen = jogo.penalties ? ` <small class="penaltis">(${escapar(jogo.penalties.replace('-', '×'))})</small>` : '';
        fim = `<span class="placar">${escapar(jogo.result.replace('-', ' × '))}${pen}</span><span class="chip chip-${res.tom}">${res.texto}</span>`;
      } else {
        fim = `<a class="icone-botao" href="${escapar(jogo.calendarLink)}" target="_blank" rel="noopener" aria-label="Adicionar à agenda">${ICONE_CALENDARIO}</a>`;
      }

      return `
        <li>
          <div class="linha${passou ? ' inativa' : ''}">
            <span class="avatar avatar-${res ? res.tom : (jogo.isHome ? 'marca' : 'cartao')}">
              <b>${fmtDia.format(data)}</b><small>${fmtSemana.format(data).replace('.', '')}</small>
            </span>
            <span class="linha-texto">
              <span class="linha-nome">${jogo.isHome ? '' : '@ '}${escapar(jogo.opponent)}</span>
              <span class="linha-meta">${mando}${status}<span>${escapar(hora)}</span></span>
              <span class="linha-sub">${escapar(nomeCurtoLiga(jogo.league))}</span>
            </span>
            <span class="linha-fim">${fim}</span>
          </div>
        </li>`;
    }

    function atualizarLista() {
      document.querySelectorAll('.segmentos button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.liga === ligaAtual)));

      let filtrados = ligaAtual === 'Todos' ? todosOsJogos : todosOsJogos.filter(j => j.league && j.league.includes(ligaAtual));
      const qtdPassados = filtrados.filter(jogoJaPassou).length;
      if (!mostrarPassados) filtrados = filtrados.filter(j => !jogoJaPassou(j));

      const btn = document.getElementById('btn-passados');
      btn.hidden = qtdPassados === 0;
      btn.textContent = mostrarPassados ? 'Ocultar jogos anteriores' : `Mostrar jogos anteriores (${qtdPassados})`;

      const alvo = document.getElementById('lista');
      if (filtrados.length === 0) {
        alvo.innerHTML = `<div class="cartao-ui vazio"><h2>Nenhum jogo pela frente</h2><p>Não há próximos jogos cadastrados para este campeonato.</p></div>`;
        return;
      }

      // Agrupa por mês, mantendo a ordem cronológica
      const grupos = [];
      for (const jogo of filtrados) {
        const iso = isoDoJogo(jogo);
        const chave = iso.slice(0, 7);
        let g = grupos[grupos.length - 1];
        if (!g || g.chave !== chave) {
          g = { chave, nome: fmtMesAno.format(dataCalendario(iso)), jogos: [] };
          grupos.push(g);
        }
        g.jogos.push(jogo);
      }

      alvo.innerHTML = grupos.map(g => `
        <div>
          <div class="grupo-titulo"><span>${g.nome}</span><span class="grupo-total">${g.jogos.length} ${g.jogos.length === 1 ? 'jogo' : 'jogos'}</span></div>
          <ul class="lista cartao-ui">${g.jogos.map(linhaDoJogo).join('')}</ul>
        </div>`).join('');
    }

    /* ---------------- Eventos ---------------- */
    document.querySelectorAll('.segmentos button').forEach(b => {
      b.addEventListener('click', () => {
        ligaAtual = b.dataset.liga;
        salvarPreferencia('agenda:liga', ligaAtual);
        atualizarLista();
      });
    });
    document.getElementById('btn-passados').addEventListener('click', () => {
      mostrarPassados = !mostrarPassados;
      atualizarLista();
    });

    /* ---------------- Carga ---------------- */
    fetch('db.json', { cache: 'no-cache' })
      .then(res => res.json())
      .then(jogos => {
        todosOsJogos = jogos;
        const fontes = [...new Set(jogos.map(j => j.fonte).filter(Boolean))];
        if (fontes.length) document.getElementById('rodape').textContent = `Dados: ${fontes.join(' e ')}, atualizados todo dia. Horários de Brasília.`;
        renderizarDestaque(jogos);
        atualizarLista();
      })
      .catch(err => {
        console.error('Erro ao carregar jogos', err);
        document.getElementById('destaque').innerHTML = '';
        document.getElementById('lista').innerHTML = `<div class="cartao-ui vazio"><h2>Não foi possível carregar os jogos</h2><p>Tente atualizar a página em instantes.</p></div>`;
      });
  </script>
