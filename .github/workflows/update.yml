name: Atualizar Agenda Tricolor diariamente
on:
  schedule:
    - cron: '0 10 * * *' # Todo dia às 07:00 (Brasília)
  workflow_dispatch: # Permite rodar manualmente pelo site do GitHub

permissions:
  contents: write # Dá permissão ao robô para fazer commit do novo db.json

jobs:
  update-db:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Buscar jogos (ESPN, com OpenFootball de reserva) e atualizar db.json
        run: node fetch-jogos.js

      - name: Fazer commit do banco de dados (se houver mudanças)
        run: |
          git config --global user.name "Agenda-Bot"
          git config --global user.email "bot@github.com"
          git add db.json
          if ! git diff --staged --quiet; then
            git commit -m "Auto-atualizando agenda com os últimos jogos"
            git push
          else
            echo "Nenhuma atualização nos jogos por enquanto."
          fi
